<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Ananta CRM - Add User Modal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline": "#946e6c",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#004e5a",
                        "on-secondary-fixed-variant": "#91061a",
                        "error": "#ba1a1a",
                        "error-container": "#ffdad6",
                        "surface": "#fff8f7",
                        "surface-bright": "#fff8f7",
                        "inverse-on-surface": "#ffedeb",
                        "tertiary": "#006574",
                        "surface-container-highest": "#ffdad7",
                        "background": "#fff8f7",
                        "surface-tint": "#bf0023",
                        "secondary-fixed-dim": "#ffb3af",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#fff0ef",
                        "secondary-container": "#fd5c5d",
                        "on-secondary": "#ffffff",
                        "on-background": "#2a1615",
                        "primary-fixed": "#ffdad8",
                        "outline-variant": "#e9bcb9",
                        "primary": "#bb0022",
                        "on-tertiary-container": "#f8fdff",
                        "on-primary-fixed": "#410006",
                        "inverse-surface": "#412b29",
                        "tertiary-fixed-dim": "#6ed5e9",
                        "on-secondary-container": "#60000c",
                        "tertiary-fixed": "#a2eeff",
                        "surface-variant": "#ffdad7",
                        "on-secondary-fixed": "#410006",
                        "surface-dim": "#f7d1cf",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#ffb3af",
                        "on-tertiary": "#ffffff",
                        "surface-container-high": "#ffe1df",
                        "secondary": "#b4262e",
                        "on-primary-container": "#fffbff",
                        "on-surface": "#2a1615",
                        "surface-container": "#ffe9e7",
                        "primary-container": "#e9002d",
                        "tertiary-container": "#008092",
                        "primary-fixed-dim": "#ffb3af",
                        "on-primary-fixed-variant": "#930018",
                        "on-primary": "#ffffff",
                        "secondary-fixed": "#ffdad8",
                        "on-tertiary-fixed": "#001f25",
                        "on-surface-variant": "#5f3e3d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "stack-md": "16px",
                        "sidebar-width": "260px",
                        "unit": "4px",
                        "container-padding": "24px",
                        "stack-sm": "8px"
                    },
                    "fontFamily": {
                        "label-caps": ["Hanken Grotesk"],
                        "display": ["Hanken Grotesk"],
                        "table-data": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-sm": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "display": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "table-data": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "headline-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen overflow-hidden">
<!-- Background Simulation (Dimmed List View) -->
<div class="fixed inset-0 z-0 bg-surface-container opacity-30 flex flex-col p-container-padding pointer-events-none">
<div class="h-16 border-b border-outline-variant mb-stack-md flex items-center justify-between">
<div class="font-headline-lg text-headline-lg">Users</div>
<div class="w-32 h-10 bg-primary-container rounded"></div>
</div>
<div class="flex-1 bg-surface-container-lowest rounded-lg border border-outline-variant p-stack-md flex flex-col gap-unit">
<div class="h-12 bg-surface-container-low border-b border-outline-variant"></div>
<div class="h-12 border-b border-outline-variant opacity-50"></div>
<div class="h-12 border-b border-outline-variant opacity-50"></div>
<div class="h-12 border-b border-outline-variant opacity-50"></div>
</div>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-inverse-surface/60 backdrop-blur-[2px] p-container-padding">
<!-- Modal Container -->
<div aria-labelledby="modal-title" aria-modal="true" class="bg-surface-container-lowest w-full max-w-2xl rounded-xl shadow-lg border border-outline-variant flex flex-col overflow-hidden" role="dialog">
<!-- Modal Header -->
<div class="px-container-padding py-stack-md border-b border-outline-variant flex items-center justify-between bg-surface-bright">
<div class="flex items-center gap-stack-sm text-primary">
<span class="material-symbols-outlined text-[24px]">person_add</span>
<h2 class="font-headline-md text-headline-md text-on-surface" id="modal-title">Add New User</h2>
</div>
<button class="text-on-surface-variant hover:text-on-surface transition-colors p-unit rounded hover:bg-surface-container">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Modal Body (Form) -->
<div class="p-container-padding bg-surface-bright overflow-y-auto max-h-[70vh]">
<form class="flex flex-col gap-stack-md">
<!-- Username Field -->
<div class="flex flex-col gap-unit">
<label class="font-body-sm text-body-sm font-semibold text-on-surface" for="username">Username *</label>
<input class="w-full h-10 px-3 bg-surface-container-lowest border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow text-body-md" id="username" name="username" placeholder="johndoe123" required="" type="text"/>
</div>
<!-- Name Row (2 columns) -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-stack-md">
<div class="flex flex-col gap-unit">
<label class="font-body-sm text-body-sm font-semibold text-on-surface" for="firstName">First Name *</label>
<input class="w-full h-10 px-3 bg-surface-container-lowest border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow text-body-md" id="firstName" name="firstName" placeholder="John" required="" type="text"/>
</div>
<div class="flex flex-col gap-unit">
<label class="font-body-sm text-body-sm font-semibold text-on-surface" for="lastName">Last Name *</label>
<input class="w-full h-10 px-3 bg-surface-container-lowest border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow text-body-md" id="lastName" name="lastName" placeholder="Doe" required="" type="text"/>
</div>
</div>
<!-- Contact Row (2 columns) -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-stack-md">
<div class="flex flex-col gap-unit">
<label class="font-body-sm text-body-sm font-semibold text-on-surface" for="email">Email Address *</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">mail</span>
</div>
<input class="w-full h-10 pl-10 pr-3 bg-surface-container-lowest border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow text-body-md" id="email" name="email" placeholder="john.doe@example.com" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-unit">
<label class="font-body-sm text-body-sm font-semibold text-on-surface" for="phone">Phone Number</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">phone</span>
</div>
<input class="w-full h-10 pl-10 pr-3 bg-surface-container-lowest border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow text-body-md" id="phone" name="phone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
</div>
<!-- Role & Password Row (2 columns) -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-stack-md">
<div class="flex flex-col gap-unit">
<label class="font-body-sm text-body-sm font-semibold text-on-surface" for="role">System Role *</label>
<div class="relative">
<select class="w-full h-10 pl-3 pr-10 appearance-none bg-surface-container-lowest border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow text-body-md cursor-pointer" id="role" name="role" required="">
<option disabled="" selected="" value="">Select a role...</option>
<option value="admin">Admin</option>
<option value="staff">Staff</option>
</select>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">expand_more</span>
</div>
</div>
</div>
<div class="flex flex-col gap-unit">
<label class="font-body-sm text-body-sm font-semibold text-on-surface" for="password">Temporary Password *</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">lock</span>
</div>
<input class="w-full h-10 pl-10 pr-10 bg-surface-container-lowest border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow text-body-md" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant hover:text-primary transition-colors cursor-pointer" type="button">
<span class="material-symbols-outlined text-[18px]">visibility</span>
</button>
</div>
</div>
</div>
</form>
</div>
<!-- Modal Footer (Actions) -->
<div class="px-container-padding py-stack-md border-t border-outline-variant bg-surface-container flex items-center justify-end gap-stack-sm">
<button class="px-4 py-2 font-body-sm text-body-sm font-semibold text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high rounded transition-colors" type="button">
                    Cancel
                </button>
<button class="px-6 py-2 font-body-sm text-body-sm font-semibold text-on-primary bg-primary rounded shadow-sm hover:bg-[#a0001d] focus:ring-2 focus:ring-primary/50 focus:outline-none transition-all active:scale-[0.98] flex items-center gap-unit" type="submit">
<span class="material-symbols-outlined text-[18px]">save</span>
                    Save User
                </button>
</div>
</div>
</div>
</body></html>
