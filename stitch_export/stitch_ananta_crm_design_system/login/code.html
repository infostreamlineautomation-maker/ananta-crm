<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Ananta CRM - Login</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Hanken Grotesk -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Config -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "error-container": "#ffdad6",
                    "secondary-fixed": "#ffdad8",
                    "tertiary-fixed": "#a2eeff",
                    "secondary-fixed-dim": "#ffb3af",
                    "surface-container": "#ffe9e7",
                    "primary-fixed": "#ffdad8",
                    "on-secondary-fixed-variant": "#91061a",
                    "inverse-on-surface": "#ffedeb",
                    "outline-variant": "#e9bcb9",
                    "background": "#ffffff", /* Overridden per prompt to pure white */
                    "on-tertiary-fixed": "#001f25",
                    "surface-container-high": "#ffe1df",
                    "secondary": "#b4262e",
                    "on-primary": "#ffffff",
                    "on-primary-fixed-variant": "#930018",
                    "surface-container-highest": "#ffdad7",
                    "primary-container": "#e9002d",
                    "inverse-primary": "#ffb3af",
                    "surface-container-lowest": "#ffffff",
                    "surface-bright": "#fff8f7",
                    "surface": "#ffffff", /* Overridden for card */
                    "surface-dim": "#f7d1cf",
                    "secondary-container": "#fd5c5d",
                    "tertiary-container": "#008092",
                    "on-primary-fixed": "#410006",
                    "error": "#ba1a1a",
                    "surface-variant": "#ffdad7",
                    "primary": "#c31432", /* Overridden per prompt */
                    "surface-container-low": "#fff0ef",
                    "on-secondary": "#ffffff",
                    "primary-fixed-dim": "#ffb3af",
                    "surface-tint": "#bf0023",
                    "tertiary-fixed-dim": "#6ed5e9",
                    "on-surface": "#2a1615",
                    "on-secondary-container": "#60000c",
                    "on-error-container": "#93000a",
                    "on-tertiary-fixed-variant": "#004e5a",
                    "on-error": "#ffffff",
                    "inverse-surface": "#412b29",
                    "on-surface-variant": "#5f3e3d",
                    "on-primary-container": "#fffbff",
                    "on-tertiary": "#ffffff",
                    "outline": "#946e6c",
                    "on-tertiary-container": "#f8fdff",
                    "on-secondary-fixed": "#410006",
                    "tertiary": "#006574",
                    "on-background": "#2a1615"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "10px", /* Overridden per prompt */
                    "full": "9999px"
            },
            "spacing": {
                    "sidebar-width": "260px",
                    "stack-sm": "8px",
                    "gutter": "16px",
                    "unit": "4px",
                    "stack-md": "16px",
                    "container-padding": "24px"
            },
            "fontFamily": {
                    "body-md": ["Hanken Grotesk"],
                    "headline-lg": ["Hanken Grotesk"],
                    "body-lg": ["Hanken Grotesk"],
                    "display": ["Hanken Grotesk"],
                    "label-caps": ["Hanken Grotesk"],
                    "table-data": ["Hanken Grotesk"],
                    "body-sm": ["Hanken Grotesk"],
                    "headline-md": ["Hanken Grotesk"]
            },
            "fontSize": {
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "display": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-caps": ["11px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "table-data": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
                    "body-sm": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
                    "headline-md": ["18px", {"lineHeight": "24px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        /* Base styles */
        body {
            font-family: 'Hanken Grotesk', sans-serif;
            background-color: #FFFFFF; /* Hardcoded white background as requested */
            color: #2a1615; /* on-background */
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Subtle shadow for the card */
        .card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<!-- Login Card -->
<main class="w-full max-w-[400px] bg-surface rounded-xl card-shadow border border-outline-variant/30 p-container-padding flex flex-col gap-stack-md">
<!-- Header -->
<header class="flex flex-col items-center text-center gap-unit mb-4">
<!-- Red accent mark -->
<div class="w-8 h-1 bg-primary rounded-full mb-2"></div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Ananta CRM</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to your account</p>
</header>
<!-- Error Banner -->
<div class="bg-error-container text-on-error-container p-3 rounded-lg flex items-start gap-2 border border-error/20">
<span class="material-symbols-outlined text-error text-[20px] shrink-0 mt-[2px]" data-icon="error">error</span>
<p class="font-body-sm text-body-sm text-error">Invalid username or password</p>
</div>
<!-- Form -->
<form action="#" class="flex flex-col gap-4" method="POST" onsubmit="event.preventDefault();">
<!-- Username Field -->
<div class="flex flex-col gap-unit">
<label class="font-body-sm text-body-sm font-semibold text-on-surface" for="username">Username</label>
<input class="w-full px-3 py-2 bg-surface-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors" id="username" name="username" placeholder="Enter your username" required="" type="text" value="admin.user"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-unit relative">
<label class="font-body-sm text-body-sm font-semibold text-on-surface" for="password">Password</label>
<div class="relative w-full">
<input class="w-full pl-3 pr-10 py-2 bg-surface-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password" value="password123"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-3 text-on-surface-variant hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility" id="visibility-icon">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-[#a11029] text-on-primary font-body-md text-body-md font-semibold py-2.5 px-4 rounded-lg transition-colors mt-2" type="submit">
                Sign In
            </button>
</form>
</main>
<!-- Inline Script for Password Toggle -->
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibility-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility_off';
                visibilityIcon.setAttribute('data-icon', 'visibility_off');
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility';
                visibilityIcon.setAttribute('data-icon', 'visibility');
            }
        }
    </script>
</body></html>
